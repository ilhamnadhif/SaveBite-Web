name: SaveBite Web CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: savebite-web-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate SaveBite Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder public values: the build inlines NEXT_PUBLIC_* into the
      # bundle, and a real key is not needed to typecheck or compile.
      NEXT_PUBLIC_SUPABASE_URL: https://mnxnwkgwiqvcgqximcvb.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_AUTH_CALLBACK_URL: http://localhost:3000/auth/callback
      NEXT_PUBLIC_COOKIE_DOMAIN: ""
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: Mid-client-ci-placeholder
      NEXT_PUBLIC_MIDTRANS_ENVIRONMENT: sandbox
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs first and cheap: catches a migration that would expose a
      # credential table or leave a definer function unsearch_path-pinned.
      - name: Check SQL migrations
        run: pnpm check:migrations

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Validate Docker Compose
        run: docker compose config --quiet

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Building (not just composing) is what catches a broken Dockerfile or an
      # install that only works on a developer machine.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: savebite-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name savebite-ci -p 3111:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder \
            -e NEXT_PUBLIC_AUTH_CALLBACK_URL=http://localhost:3111/auth/callback \
            savebite-web:ci
          trap 'docker logs savebite-ci; docker rm -f savebite-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3111/api/health >/dev/null; then
              echo "container is live after ${attempt}s"
              curl --silent http://127.0.0.1:3111/api/health
              exit 0
            fi
            sleep 1
          done
          echo "container never became live"
          exit 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, docker]
    if: github.ref == 'refs/heads/main' && vars.SAVEBITE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install --yes rsync

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/savebite-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/savebite-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/savebite-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/savebite-ssh/id_ed25519" "$RUNNER_TEMP/savebite-ssh/known_hosts"

      - name: Copy app to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh_options=(-i "$RUNNER_TEMP/savebite-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/savebite-ssh/known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /home/$VPS_USER/savebite-web"
          rsync -az --delete \
            --exclude='/.git' \
            --exclude='node_modules/' \
            --exclude='/.env' \
            --exclude='.env.local' \
            --exclude='.next/' \
            --exclude='**/*.tsbuildinfo' \
            -e "ssh ${ssh_options[*]}" \
            ./ "$VPS_USER@$VPS_HOST:/home/$VPS_USER/savebite-web/"

      - name: Build and start containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/savebite-ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/savebite-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd /home/$VPS_USER/savebite-web && docker compose build web && docker compose up --detach --no-build && docker compose ps"

      - name: Wait for readiness
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # /api/ready only reports 200 once the process is configured *and*
          # Supabase answers, so this catches a broken .env on the VPS instead
          # of just confirming that a port is open.
          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error "http://$VPS_HOST:3002/api/ready" >/dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            echo "App did not become ready on port 3002"
            curl --silent "http://$VPS_HOST:3002/api/ready" || true
            exit 1
          fi
          echo "app is ready"

      - name: Verify security headers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          headers=$(curl --silent --dump-header - --output /dev/null "http://$VPS_HOST:3002/")
          for expected in "content-security-policy" "x-content-type-options: nosniff" "x-frame-options: DENY" "referrer-policy"; do
            if ! printf '%s' "$headers" | grep -qi "$expected"; then
              echo "missing security header: $expected"
              exit 1
            fi
          done

      - name: Audit recent application error logs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh_options=(-i "$RUNNER_TEMP/savebite-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/savebite-ssh/known_hosts" -o StrictHostKeyChecking=yes)
          logs=$(ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "cd /home/$VPS_USER/savebite-web && docker compose logs --since=10m --no-color web")
          if printf '%s\n' "$logs" | grep -qF '"level":"error"'; then
            echo "Error-level app logs were emitted in the last 10 minutes; log contents are withheld from CI output."
          else
            echo "No error-level app logs in the last 10 minutes."
          fi

      - name: Remove temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/savebite-ssh"
