name: SaveBite Web CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: savebite-web-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate SaveBite Web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mnxnwkgwiqvcgqximcvb.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_AUTH_CALLBACK_URL: http://localhost:3000/auth/callback
      NEXT_PUBLIC_COOKIE_DOMAIN: ""
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: Mid-client-ci-placeholder
      NEXT_PUBLIC_MIDTRANS_ENVIRONMENT: sandbox
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm typecheck && pnpm build

      - name: Validate Docker Compose
        run: docker compose config --quiet

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.SAVEBITE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install --yes rsync

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/savebite-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/savebite-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/savebite-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/savebite-ssh/id_ed25519" "$RUNNER_TEMP/savebite-ssh/known_hosts"

      - name: Copy app to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh_options=(-i "$RUNNER_TEMP/savebite-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/savebite-ssh/known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /home/$VPS_USER/savebite-web"
          rsync -az --delete \
            --exclude='/.git' \
            --exclude='node_modules/' \
            --exclude='/.env' \
            --exclude='.next/' \
            -e "ssh ${ssh_options[*]}" \
            ./ "$VPS_USER@$VPS_HOST:/home/$VPS_USER/savebite-web/"

      - name: Build and start containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/savebite-ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/savebite-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd /home/$VPS_USER/savebite-web && docker compose build --parallel 1 && docker compose up --detach --no-build && docker compose ps"

      - name: Verify public app port
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://$VPS_HOST:3000/" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          fi
          if [ "$ready" != true ]; then
            echo "App on port 3000 did not become reachable"
            exit 1
          fi

      - name: Remove temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/savebite-ssh"
