packages:
  - apps/*
  - packages/*

# pnpm >=10 stores settings here (not in package.json#pnpm).
# Pinning the allowlist keeps `pnpm install --frozen-lockfile` deterministic in
# CI and in the Docker build instead of silently skipping native postinstalls.
# `esbuild` is required by vitest; `sharp` by Next.js image optimisation.
allowBuilds:
  esbuild: true
  sharp: true

# Security overrides.
#
# next@15.5.x pins postcss@8.4.31, which carries two high-severity advisories
# (GHSA-7fh5-64p2-3v2j arbitrary file read via attacker-controlled CSS
# comments, and GHSA-r28c-9q8g-f849 path traversal in source-map auto-loading).
# The whole 15.5 line still pins the vulnerable version, so the fix has to be an
# override rather than a version bump. postcss 8.5.x is API compatible with
# 8.4.x, so this is a drop-in; drop the override once next ships a patched
# postcss (tracked by the `pnpm audit --audit-level=high` CI step).
#
# The others below clear high and critical advisories in transitive packages.
# `next` also pins the peer that packages/web-shared resolves on its own.
overrides:
  postcss: ">=8.5.23"
  next: ">=15.5.28 <16"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  vite: ">=7.3.7 <8"

# Advisories accepted for `pnpm audit` because no fixed release exists yet.
#
# GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, stack exhaustion on deeply nested
# patterns): reached only through @next/eslint-plugin-next > fast-glob >
# micromatch, a lint-time dev dependency that never ships in the image's
# runtime and only expands glob patterns written in this repository. The
# advisory names 3.0.4 as the fix, which is not published on npm. Remove this
# entry (and add an override) as soon as braces 3.0.4 is released.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
